<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Penentuan Grade Nilai</title>
</head>
<body>
    <h2>Aplikasi Pengambil Keputusan Nilai</h2>
    
    <label for="inputNilai">Masukkan Nilai (0 - 100): </label>
    <input type="number" id="inputNilai" min="0" max="100">
    <button onclick="hitungGrade()">Hitung</button>

    <h3 id="hasilGrade"></h3>

    <script>
        function hitungGrade() {
            const nilai = parseFloat(document.getElementById("inputNilai").value);
            const teksHasil = document.getElementById("hasilGrade");

            if (isNaN(nilai) || nilai < 0 || nilai > 100) {
                alert("Harap masukkan nilai angka yang valid antara 0 sampai 100!");
                teksHasil.innerHTML = "";
                return;
            }

            let grade = "";
            if (nilai >= 0 && nilai <= 20) {
                grade = "E";
            } else if (nilai >= 21 && nilai <= 40) {
                grade = "D";
            } else if (nilai >= 41 && nilai <= 60) {
                grade = "C";
            } else if (nilai >= 61 && nilai <= 80) {
                grade = "B";
            } else if (nilai >= 81 && nilai <= 100) {
                grade = "A";
            }

            teksHasil.innerHTML = "Nilai: " + nilai + "<br>Grade: " + grade;
        }
    </script>
</body>
</html>
