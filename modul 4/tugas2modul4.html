<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Sederhana</title>
</head>
<body>
    <h2>Kalkulator Sederhana</h2>

    <table>
        <tr>
            <td>Angka Pertama</td>
            <td>:</td>
            <td><input type="number" id="angka1"></td>
        </tr>
        <tr>
            <td>Angka Kedua</td>
            <td>:</td>
            <td><input type="number" id="angka2"></td>
        </tr>
        <tr>
            <td colspan="3" style="padding-top: 10px;">
                <button onclick="hitung('+')">+</button>
                <button onclick="hitung('-')">-</button>
                <button onclick="hitung('*')">&times;</button>
                <button onclick="hitung('/')">/</button>
            </td>
        </tr>
    </table>

    <h3 id="hasilKalkulator">Hasil: -</h3>

    <script>
        function hitung(operator) {
            const val1 = document.getElementById("angka1").value;
            const val2 = document.getElementById("angka2").value;

            if (val1 === "" || val2 === "") {
                alert("Kedua kolom angka harus diisi!");
                return;
            }

            const num1 = parseFloat(val1);
            const num2 = parseFloat(val2);
            let hasil = 0;

            if (operator === "+") {
                hasil = num1 + num2;
            } else if (operator === "-") {
                hasil = num1 - num2;
            } else if (operator === "*") {
                hasil = num1 * num2;
            } else if (operator === "/") {
                if (num2 === 0) {
                    alert("Kesalahan: Pembagian dengan angka 0 tidak diperbolehkan!");
                    return;
                }
                hasil = num1 / num2;
            }

            document.getElementById("hasilKalkulator").innerHTML = "Hasil: " + hasil;
        }
    </script>
</body>
</html>
