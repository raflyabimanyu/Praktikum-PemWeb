<!DOCTYPE html>
<html>
<head>
    <title>Latihan CSS</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 80%;
        }

        .atas {
            height: 100px;
            border: 2px solid black;
            margin-bottom: 5px;
        }

        .tengah {
            height: 450px;
            border: 2px solid black;
            margin-bottom: 5px;
        }

        .bawah {
            height: 35px;
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="atas"></div>
        <div class="tengah"></div>
        <div class="bawah"></div>
    </div>

</body>
</html>
