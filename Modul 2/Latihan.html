<!DOCTYPE html>
<html>
  <head>
    <title>Latihan Form</title>
  </head>
  <body>
    <form action="" method="post">
      <table>
        <tr>
          <td><label for="nama">Nama</label></td>
          <td><input type="text" id="nama" name="nama" value="Rafly"></td>
        </tr>
        <tr>
          <td><label for="email">Email</label></td>
          <td><input type="email" id="email" name="email" value="rafly@gmail.com"></td>
        </tr>
        <tr>
          <td><label for="username">Username</label></td>
          <td><input type="text" id="username" name="username" value="raf"></td>
        </tr>
        <tr>
          <td><label for="password">Password</label></td>
          <td><input type="password" id="password" name="password" value="1234"></td>
        </tr>
        <tr>
          <td><label for="jk">Jenis Kelamin</label></td>
          <td>
            <select id="jk" name="jk">
              <option value="Laki-Laki" selected>Laki-Laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </td>
        </tr>
        <tr>
          <td><label for="alamat">Alamat</label></td>
          <td>
            <textarea id="alamat" name="alamat" rows="8" cols="35">Portugal</textarea>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <br>
            <input type="submit" value="Simpan">
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
